<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="How it works: your AI client, cloudpanel-mcp-server on your computer, SSH to the gate on the server, then sudo clpctl on CloudPanel. Each step adds a protection.">
