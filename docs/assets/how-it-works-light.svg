<text x="74" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0a58ca">Asks you to approve</text>
<path d="M276 180.0h42" stroke="#0d6efd" stroke-width="2.4" stroke-linecap="round" marker-end="url(#alight)"/>
