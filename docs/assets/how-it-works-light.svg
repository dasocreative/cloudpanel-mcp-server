<rect x="930" y="30" width="246" height="300" rx="16" fill="#f6f9ff" stroke="#d6e4ff"/>
<g transform="translate(950 50)"><rect width="44" height="44" rx="11" fill="#0d6efd"/><g transform="translate(10 10)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M6.5 9.5l3 2.5-3 2.5"/><path d="M12 15h5.5"/></g></g>
<text x="950" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0b1b33">CloudPanel</text>
<text x="950" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#4a5b75">sudo -n clpctl</text>
